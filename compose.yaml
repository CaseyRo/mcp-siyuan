services:
  mcp-siyuan:
    build: .
    restart: unless-stopped
    init: true
    ports:
      # Bind to the host's tailnet IP, never 0.0.0.0: Docker publishes 0.0.0.0 past ufw,
      # so only the Hetzner firewall would stand in front of it. BIND_IP comes from the
      # Komodo stack environment (nebula-1: its tailnet IP). Unset = compose refuses to
      # render, so the running container is left alone. Do NOT use 127.0.0.1: cloudflared
      # (host network) reaches this port via the tailnet IP. See fleet-stacks SECURITY.md.
      - "${BIND_IP:?set BIND_IP (tailnet IP) in the stack environment}:8006:8000"
    environment:
      - TRANSPORT=http
      - HOST=0.0.0.0
      - SIYUAN_URL=http://siyuan:6806
      - SIYUAN_TOKEN=${SIYUAN_TOKEN:-}
      - MCP_API_KEY=${MCP_API_KEY:-}
      - FASTMCP_HOME=/data/fastmcp
    deploy:
      resources:
        limits:
          memory: 512m
    volumes:
      - fastmcp-data:/data/fastmcp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - siyuan-cluster_default

volumes:
  fastmcp-data:

networks:
  siyuan-cluster_default:
    external: true
