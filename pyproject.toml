[project]
name = "mcp-siyuan"
version = "0.2.30"
description = "MCP server for SiYuan Notes built on FastMCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Casey Romkes" }]
dependencies = [
    "fastmcp>=4.0.10,<5.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.12.0",
    "weasyprint>=63.0",
    "cachetools>=5.3",
    "markdown-it-py>=3.0",  # update_block block splitting (already via rich)
    # Security floors (transitive deps of fastmcp; pinned to address CVEs)
    "authlib>=1.7.0",            # GHSA: CSRF in token cache handling
    "python-multipart>=0.0.27",  # GHSA: DoS via unbounded multipart headers
    "pillow>=13.0.0",            # GHSA: 37 advisories, fixed only in 13.0.0 (via weasyprint)
]

[project.scripts]
mcp-siyuan = "mcp_siyuan.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "ruff>=0.8",
]

[tool.ruff.lint]
# Pinned rather than inherited: ruff's default rule set widens between releases,
# so a dev-tools bump could turn a clean tree red (CDI-1783). Same set fleet-wide.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
# UP042 (str+Enum -> StrEnum) changes str() of enum values, which can be persisted or on the wire: fleet decision is no.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Vendored verbatim from CDiT-infrastructure/scripts/mcp_usage_middleware.py; re-copy, never edit here.
# Its noqa directives (UP017, BLE001, S110) serve repos with other rule sets.
"mcp_siyuan/usage.py" = ["RUF100", "UP017"]
